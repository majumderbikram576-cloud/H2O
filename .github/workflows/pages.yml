name: Deploy MyAssistant V3 UI

name: Deploy MyAssistant V3 UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload UI
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./ui

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4on:
