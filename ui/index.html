<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyAssistant V3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:#050509;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.header{
  width:100%;
  padding:20px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.status{
  margin-top:5px;
  font-size:14px;
  opacity:.65;
}

.orb-area{
  flex:1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.orb{
  width:210px;
  height:210px;
  border-radius:50%;
  background:radial-gradient(
    circle at 35% 30%,
    white,
    #8b6cff 18%,
    #3d20d0 55%,
    #09001f
  );
  box-shadow:
    0 0 35px #684cff,
    0 0 90px #3d22ff,
    0 0 170px #1c0870;
  animation:idle 3s ease-in-out infinite;
}

.orb.listening{
  animation:listening 1.2s ease-in-out infinite;
}

.orb.speaking{
  animation:speaking .8s ease-in-out infinite;
}

.messages{
  width:92%;
  max-width:600px;
  height:180px;
  overflow-y:auto;
  margin-top:28px;
  padding:5px;
}

.message{
  padding:11px 14px;
  margin:7px 0;
  border-radius:15px;
  background:#15151d;
  font-size:14px;
  line-height:1.4;
}

.you{background:#111827}
.assistant{background:#211b45}

.label{
  font-size:11px;
  opacity:.5;
  margin-bottom:3px;
}

.controls{
  display:flex;
  gap:12px;
  margin:8px 0 12px;
}

button{
  border:0;
  border-radius:25px;
  padding:12px 25px;
  font-size:14px;
  color:white;
  background:#31256b;
}

.stop{background:#421c2b}

button:active{
  transform:scale(.95);
}

.footer{
  width:100%;
  padding:12px;
  text-align:center;
  font-size:12px;
  opacity:.45;
}

@keyframes idle{
  0%,100%{
    transform:scale(1);
    filter:brightness(1);
  }
  50%{
    transform:scale(1.035);
    filter:brightness(1.08);
  }
}

@keyframes listening{
  0%{
    transform:scale(.96);
    filter:brightness(1);
  }
  50%{
    transform:scale(1.08);
    filter:brightness(1.18);
  }
  100%{
    transform:scale(1.14);
    filter:brightness(1.28);
  }
}

@keyframes speaking{
  0%{
    transform:scale(.98);
    filter:brightness(1);
  }
  25%{
    transform:scale(1.06);
    filter:brightness(1.12);
  }
  50%{
    transform:scale(1.14);
    filter:brightness(1.25);
  }
  75%{
    transform:scale(1.07);
    filter:brightness(1.14);
  }
  100%{
    transform:scale(1.02);
    filter:brightness(1.04);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    MyAssistant
    <div id="status" class="status">Ready</div>
  </div>

  <div class="orb-area">

    <div id="orb" class="orb"></div>

    <div id="messages" class="messages"></div>

    <div class="controls">
      <button onclick="startAssistant()">Start</button>
      <button class="stop" onclick="stopAssistant()">Stop</button>
    </div>

  </div>

  <div class="footer">
    MyAssistant V3 • Voice Mode
  </div>

</div>

<script>

const orb = document.getElementById("orb");
const status = document.getElementById("status");
const messages = document.getElementById("messages");

let lastState = "";
let lastChat = "";


async function startAssistant(){

  status.textContent = "Starting…";

  try{

    const r = await fetch(
      "http://127.0.0.1:8765/start"
    );

    if(!r.ok) throw new Error();

    status.textContent = "Listening…";

  }catch(e){

    status.textContent = "Control server unavailable";

  }
}


async function stopAssistant(){

  status.textContent = "Stopping…";

  try{

    const r = await fetch(
      "http://127.0.0.1:8765/stop"
    );

    if(!r.ok) throw new Error();

    orb.className = "orb";
    status.textContent = "Stopped";

  }catch(e){

    status.textContent = "Control server unavailable";

  }
}


async function updateState(){

  try{

    const r = await fetch(
      "/state.json?t=" + Date.now()
    );

    if(!r.ok) return;

    const data = await r.json();

    if(data.state === lastState) return;

    lastState = data.state;

    orb.className = "orb";

    if(data.state === "listening"){

      orb.className = "orb listening";
      status.textContent = "Listening…";

    }else if(data.state === "speaking"){

      orb.className = "orb speaking";
      status.textContent = "Speaking…";

    }else{

      status.textContent = "Ready";

    }

  }catch(e){}

}


async function updateChat(){

  try{

    const r = await fetch(
      "/chat.json?t=" + Date.now()
    );

    if(!r.ok) return;

    const data = await r.json();

    const key = JSON.stringify(data);

    if(key === lastChat) return;

    lastChat = key;
    messages.innerHTML = "";

    if(!Array.isArray(data)) return;

    data.forEach(item => {

      const box = document.createElement("div");

      box.className =
        "message " +
        (item.role === "you"
          ? "you"
          : "assistant");

      const label = document.createElement("div");

      label.className = "label";

      label.textContent =
        item.role === "you"
          ? "You"
          : "MyAssistant";

      const text = document.createElement("div");

      text.textContent = item.text || "";

      box.appendChild(label);
      box.appendChild(text);

      messages.appendChild(box);

    });

    messages.scrollTop = messages.scrollHeight;

  }catch(e){}

}


setInterval(updateState,500);
setInterval(updateChat,500);

updateState();
updateChat();

</script>

</body>
</html>
